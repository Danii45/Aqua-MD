# Builds the iPhone app (an unsigned .ipa for Sideloadly) on GitHub's Mac machines, since iPhone apps can only be
# built with Apple's tools, and attaches it to the newest release as AquaMD-iPhone-Beta.ipa.
name: iPhone app
on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build the .ipa
        run: bash ios/build-ipa.sh 0.4.1 "${{ github.run_number }}" "$PWD/AquaMD-iPhone-Beta.ipa"
      - name: Keep a copy with this run
        uses: actions/upload-artifact@v4
        with:
          name: AquaMD-iPhone-Beta
          path: AquaMD-iPhone-Beta.ipa
      - name: Attach it to the newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(gh release view --json tagName -q .tagName)"
          gh release upload "$TAG" AquaMD-iPhone-Beta.ipa --clobber
          echo "attached to $TAG"
