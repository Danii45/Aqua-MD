<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="../img/icon.png">
<title>Aqua MD · Spotify login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=Doto:wght@700;900&family=Michroma&display=swap">
<style>
/* Where Spotify sends you after logging in to Aqua MD. It hands the login back to the Android app (or the web
   version). The login code only works together with a secret that stays inside the app, and nothing on this
   page sends it anywhere else. */
:root {
  --h: 214; --lh: 192;
  --desk: hsl(calc(var(--h) + 7) 53% 6%);
  --desk-2: hsl(calc(var(--h) + 9) 60% 12%);
  --ink: hsl(var(--h) 100% 95%);
  --ink-dim: hsl(calc(var(--h) + 4) 34% 64%);
  --edge: hsl(calc(var(--h) - 5) 100% 79% / .45);
  --lcd: hsl(calc(var(--h) - 2) 82% 7%);
  --lcd-on: hsl(var(--lh) 100% 78%);
  --lcd-hot: hsl(calc(var(--lh) - 3) 100% 96%);
  --lcd-glow: hsl(var(--lh) 100% 72% / .55);
  --lcd-off: hsl(var(--lh) 100% 78% / .1);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh; min-height: 100dvh; display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  background: radial-gradient(900px 600px at 70% -10%, hsl(var(--h) 80% 50% / .25), transparent 70%), linear-gradient(180deg, var(--desk-2), var(--desk));
  background-color: var(--desk); color: var(--ink);
  font: 19px/1.5 "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
}
main {
  width: min(560px, 100%); padding: 22px; border-radius: 30px; display: grid; gap: 20px;
  background: linear-gradient(155deg, hsl(calc(var(--h) - 3) 100% 74% / .16), hsl(calc(var(--h) + 4) 86% 57% / .08) 42%, hsl(calc(var(--h) + 7) 78% 44% / .14));
  border: 1.5px solid var(--edge);
  box-shadow: inset 0 1.5px 0 rgba(255,255,255,.42), 0 30px 70px hsl(calc(var(--h) + 9) 100% 6% / .55);
}
.lcd { position: relative; overflow: hidden; border-radius: 22px; padding: 18px 22px 20px; display: grid; gap: 8px;
  background: radial-gradient(120% 140% at 30% 0%, hsl(calc(var(--h) - 2) 79% 13%), var(--lcd) 60%);
  border: 2px solid hsl(calc(var(--h) - 4) 100% 79% / .35); box-shadow: inset 0 0 60px hsl(calc(var(--lh) + 8) 100% 62% / .1); }
.lcd::after { content: ""; position: absolute; inset: 0; pointer-events: none; background-image: radial-gradient(hsl(var(--lh) 100% 78% / .05) 1px, transparent 1.4px); background-size: 6px 6px; }
.inds { display: flex; gap: 16px; }
.ind { font-family: "Michroma", system-ui, sans-serif; font-size: 11px; letter-spacing: .18em; color: var(--lcd-off); }
.ind.on { color: var(--lcd-on); text-shadow: 0 0 10px var(--lcd-glow); }
.ind.warn { color: #ffcf7a; text-shadow: 0 0 10px rgba(255,207,122,.5); }
h1 { margin: 0; font-family: "Doto", ui-monospace, monospace; font-weight: 900; font-size: clamp(34px, 9vw, 52px); line-height: 1.05; color: var(--lcd-on); text-shadow: 0 0 18px var(--lcd-glow); }
.sub { margin: 0; font-family: "Doto", ui-monospace, monospace; font-weight: 700; font-size: 20px; color: var(--lcd-on); opacity: .75; }
p { margin: 0; color: var(--ink-dim); }
p b { color: var(--ink); font-weight: 600; }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 68px; padding: 0 24px; border-radius: 22px;
  border: 1.5px solid hsl(calc(var(--h) - 4) 100% 81% / .6);
  background: linear-gradient(180deg, hsl(calc(var(--h) - 3) 100% 77% / .32), hsl(calc(var(--h) + 4) 86% 57% / .2));
  box-shadow: inset 0 1.5px 0 rgba(255,255,255,.55), 0 0 0 3px hsl(var(--lh) 100% 78% / .35), 0 0 34px hsl(var(--lh) 100% 72% / .35);
  color: var(--lcd-hot); font: 600 23px/1.1 "Barlow Semi Condensed", system-ui, sans-serif; text-decoration: none;
}
.btn:active { transform: translateY(2px) scale(.98); }
.small { font-size: 16px; }
.small a { color: var(--lcd-on); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="lcd" role="status">
    <div class="inds"><span class="ind on">AQUA MD</span><span class="ind on" id="ind">SPOTIFY</span></div>
    <h1 id="title">LOGIN</h1>
    <p class="sub" id="sub">Reading…</p>
  </div>
  <p id="msg"></p>
  <a class="btn" id="back" href="#" hidden>Back to Aqua MD</a>
  <p class="small" id="alt" hidden>Button not working? Open Aqua MD and press <b>Log in with Spotify</b> again.</p>
</main>
<script>
(() => {
  'use strict';
  const q = new URLSearchParams(location.search);
  const state = q.get('state') || '';
  const $ = id => document.getElementById(id);
  const show = (title, sub, msg) => { $('title').textContent = title; $('sub').textContent = sub; $('msg').innerHTML = msg; };
  if (!state || !(q.has('code') || q.has('error'))) {
    show('NOTHING HERE', 'Spotify login page', 'This page finishes Spotify logins for <b>Aqua MD</b>. There’s nothing to do here. <a href="../" style="color:var(--lcd-on)">Go to the Aqua MD website</a>');
    return;
  }
  const cancelled = q.get('error') === 'access_denied';
  if (state[0] === 'w') { location.replace('../app/' + location.search); return; }
  if (state[0] !== 'a') { show('UNKNOWN LOGIN', 'Try again from Aqua MD', 'Open Aqua MD and press <b>Log in with Spotify</b> again.'); return; }
  // Android app: hand the answer to aquamd://callback. Chrome opens apps through intent:// links.
  const query = location.search.slice(1);
  const isAndroid = /Android/i.test(navigator.userAgent);
  const link = isAndroid ? `intent://callback?${query}#Intent;scheme=aquamd;package=app.aquamd.player;end` : `aquamd://callback?${query}`;
  $('back').href = link;
  $('back').hidden = false;
  $('alt').hidden = false;
  if (cancelled) { $('ind').className = 'ind warn'; show('CANCELLED', 'Spotify login', 'You didn’t agree, so Aqua MD isn’t connected. Tap below to go back.'); }
  else if (q.get('error')) { $('ind').className = 'ind warn'; show('NOT CONNECTED', 'Spotify said: ' + q.get('error'), 'Tap below to go back to Aqua MD.'); }
  else show('CONNECTED', 'Almost done', 'Spotify said yes. Tap <b>Back to Aqua MD</b> to finish.');
  // Try to go back on our own; if the browser wants a tap first, the button is right there.
  setTimeout(() => { location.href = link; }, 250);
})();
</script>
</body>
</html>
